services:
  postgres:
    image: postgres:17
    container_name: taskforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  taskforge:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: taskforge-app
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}

    ports:
      - "8080:8080"

volumes:
  postgres_data: